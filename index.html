function getBaseUrl() {
    let path = window.location.pathname;
    if (path.endsWith('index.html')) {
        path = path.substring(0, path.length - 'index.html'.length);
    }
    return window.location.origin + path;
}

function getProductFromUrl() {
  const matchProduct = (str) => {
    if (!str) return null;
    const decoded = decodeURIComponent(str).trim().toLowerCase();
    return products.find(p => 
      p.nameEn.toLowerCase() === decoded ||
      p.nameHe.toLowerCase() === decoded ||
      p.id.toString() === decoded
    );
  };

  const params = new URLSearchParams(window.location.search);
  const pParam = params.get('product') || params.get('p');
  if (pParam) {
    const found = matchProduct(pParam);
    if (found) return found;
  }

  if (window.location.hash) {
    const found = matchProduct(window.location.hash.replace(/^#/, ''));
    if (found) return found;
  }

  return null;
}

function switchCartScreen(screen) {
  if(screen === 'form' && cart.length === 0) return;
  
  if(screen === 'form') {
      currentOrderNumber = generateOrderNumber();
      document.getElementById('hidden-order-number').value = currentOrderNumber;
      document.getElementById('order-form-subject').value = `New Order ${currentOrderNumber} from MM 3D Printing`;
  }

  document.getElementById('cart-items-list').classList.toggle('hidden', screen !== 'items');
  document.getElementById('cart-screen-form').classList.toggle('hidden', screen !== 'form');

function addToCart(pid) {
  const p = products.find(prod => prod.id === pid);
  const colorId = document.getElementById('selected-color').value;
  const qty = parseInt(document.getElementById('detail-qty').value);
  const color = availableColors.find(c => c.id === colorId);
  cart.push({ ...p, color, qty, cartId: Date.now() });
  updateCartUI();
  toggleCart();
}

function calculateDiscount(totalQty) {
  if (totalQty >= 100) return 0.25;
  if (totalQty >= 50) return 0.20;
  if (totalQty >= 30) return 0.15;
  if (totalQty >= 20) return 0.10;
  return 0;
}

function getNextTierMessage(totalQty) {
  let count, percent;
  if (totalQty < 20) { count = 20 - totalQty; percent = 10; }
  else if (totalQty < 30) { count = 30 - totalQty; percent = 15; }
  else if (totalQty < 50) { count = 50 - totalQty; percent = 20; }
  else if (totalQty < 100) { count = 100 - totalQty; percent = 25; }
  else { return ui[currentLang].maxBulk; }
  
  return ui[currentLang].addMoreFor.replace('{count}', count).replace('{percent}', percent);
}

function updateCartUI() {
  const list = document.getElementById('cart-items-list');
  const count = document.getElementById('cart-count');
  const subtotalEl = document.getElementById('cart-subtotal');
  const totalEl = document.getElementById('cart-total');
  const discountRow = document.getElementById('discount-row');
  const discountValEl = document.getElementById('cart-discount-val');
  const couponRow = document.getElementById('coupon-row');
  const couponValEl = document.getElementById('coupon-discount-val');
  const hiddenSummary = document.getElementById('hidden-order-summary');
  const bulkArea = document.getElementById('bulk-info-area');
  
  const totalItemsQty = cart.reduce((acc, i) => acc + i.qty, 0);
  count.innerText = totalItemsQty;
  
  if(!list.classList.contains('hidden')) {
    list.innerHTML = cart.length ? '' : `<p class="text-center text-slate-400 py-10">${ui[currentLang].emptyCart}</p>`;
  }
  
  let subtotal = 0;
  let summaryText = `ORDER NUMBER: ${currentOrderNumber}\n\nDETAILS:\n`;
  
  cart.forEach(item => {
    const rowPrice = item.priceValue * item.qty;
    subtotal += rowPrice;
    summaryText += `- ${item.nameEn} (Color: ${item.color.en}, Qty: ${item.qty}) -> ₪${rowPrice.toFixed(2)}\n`;
    
    if(!list.classList.contains('hidden')) {
      const div = document.createElement('div');
      div.className = "flex gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100";
      div.innerHTML = `
        <img src="${BASE_IMG_URL}${encodeURIComponent(item.img)}" class="w-16 h-16 rounded-xl object-cover">
        <div class="flex-grow">
          <h4 class="font-bold text-sm">${currentLang === 'en' ? item.nameEn : item.nameHe}</h4>
          <div class="text-[10px] text-slate-400 flex items-center gap-1 mt-1">
            <div class="w-2 h-2 rounded-full" style="background:${item.color.hex}"></div>
            ${currentLang === 'en' ? item.color.en : item.color.he}
          </div>
          <div class="flex items-center gap-3 mt-2">
            <div class="control-pill shadow-sm justify-between w-24">
               <button onclick="updateCartQty(${item.cartId}, -1)" class="qty-btn"><i class="fas fa-minus text-[10px]"></i></button>
               <input type="number" value="${item.qty}" readonly class="w-6 text-center bg-transparent font-black text-sm">
               <button onclick="updateCartQty(${item.cartId}, 1)" class="qty-btn"><i class="fas fa-plus text-[10px]"></i></button>
            </div>
            <div class="font-black text-sm text-green-600">₪${rowPrice.toFixed(2)}</div>
          </div>
        </div>
        <button onclick="removeFromCart(${item.cartId})" class="text-slate-300 hover:text-red-500 self-start p-2"><i class="fas fa-trash-alt"></i></button>
      `;
      list.appendChild(div);
    }
  });
  
  const discPercent = calculateDiscount(totalItemsQty);
  const discAmount = subtotal * discPercent;
  
  const couponDiscPercent = appliedCoupon ? appliedCoupon.discount : 0;
  const couponDiscAmount = subtotal * couponDiscPercent;
  
  // Coupon discounts do not apply to bulk orders (when bulk discount is active)
  let finalDiscountAmount = 0;
  let discountType = '';
  let discountPercent = 0;
  
  if (discAmount > 0) {
    // Bulk discount takes priority
    finalDiscountAmount = discAmount;
    discountType = 'bulk';
    discountPercent = discPercent;
  } else if (couponDiscAmount > 0) {
    // Coupon discount only applies if no bulk discount
    finalDiscountAmount = couponDiscAmount;
    discountType = 'coupon';
    discountPercent = couponDiscPercent;
  }
  
  const afterAllDiscounts = subtotal - finalDiscountAmount;
  
  const deliverySelect = document.getElementById('delivery-select');
  const deliveryFee = deliverySelect ? parseInt(deliverySelect.selectedOptions[0].getAttribute('data-fee')) : 0;
  const finalTotal = afterAllDiscounts + deliveryFee;

  subtotalEl.innerText = `₪${subtotal.toFixed(2)}`;
  
  if (discountType === 'bulk') {
    discountRow.classList.remove('hidden');
    discountValEl.innerText = `-₪${discAmount.toFixed(2)} (${(discPercent*100)}%)`;
    couponRow.classList.add('hidden');
    // Clear coupon message if bulk discount is applied
    const couponMessage = document.getElementById('coupon-message');
    if (couponMessage && appliedCoupon) {
      couponMessage.textContent = ui[currentLang].couponNotApp;
      couponMessage.className = 'text-xs mt-2 text-orange-500';
      couponMessage.classList.remove('hidden');
    }
  } else if (discountType === 'coupon') {
    discountRow.classList.add('hidden');
    couponRow.classList.remove('hidden');
    couponValEl.innerText = `-₪${couponDiscAmount.toFixed(2)} (${(couponDiscPercent*100)}%)`;
  } else {
    discountRow.classList.add('hidden');
    couponRow.classList.add('hidden');
  }
  
  totalEl.innerText = `₪${finalTotal.toFixed(2)}`;

  if(cart.length > 0 && !document.getElementById('cart-screen-form').classList.contains('hidden')) {
      bulkArea.innerHTML = `
        <div class="p-3 bg-slate-100 border border-slate-200 rounded-xl text-center">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">${ui[currentLang].orderRef}</span>
          <span class="text-lg font-black text-slate-900">#${currentOrderNumber}</span>
        </div>
      `;
  } else if(cart.length > 0) {
    bulkArea.innerHTML = `
      <div class="p-3 bg-blue-50 border border-blue-100 rounded-xl text-[11px] text-blue-700 font-medium">
        <i class="fas fa-info-circle ${currentLang === 'he' ? 'ml-1' : 'mr-1'}"></i> ${getNextTierMessage(totalItemsQty)}
      </div>
    `;
  } else {
    bulkArea.innerHTML = '';
  }

  summaryText += `\n------------------\n`;
  summaryText += `Items Subtotal: ₪${subtotal.toFixed(2)}\n`;
  
  if (appliedCoupon) {
      summaryText += `Coupon Used: ${appliedCoupon.code}\n`;
  } else {
      summaryText += `Coupon Used: None\n`;
  }
  
  if(discountType === 'bulk') summaryText += `Bulk Discount (${(discountPercent*100).toFixed(0)}%): -₪${finalDiscountAmount.toFixed(2)}\n`;
  if(discountType === 'coupon') summaryText += `Coupon Discount (${(discountPercent*100).toFixed(0)}%): -₪${finalDiscountAmount.toFixed(2)}\n`;
  summaryText += `Delivery Choice: ${deliverySelect?.selectedOptions[0].text || 'Pickup'}\n`;
  
  const addrValue = document.getElementById('address-field').value;
  if(addrValue) summaryText += `Address: ${addrValue}\n`;
  
  summaryText += `TOTAL ORDER: ₪${finalTotal.toFixed(2)}`;
  
  if(hiddenSummary) hiddenSummary.value = summaryText;
}

function removeFromCart(cartId) {
  cart = cart.filter(i => i.cartId !== cartId);
  updateCartUI();
}

function updateCartQty(cartId, change) {
  const item = cart.find(i => i.cartId === cartId);
  if (item) {
    item.qty += change;
    if (item.qty < 1) item.qty = 1;
    updateCartUI();
  }
}

function applyCoupon() {
  const input = document.getElementById('coupon-input');
  const message = document.getElementById('coupon-message');
  const code = input.value.trim().toUpperCase();
  
  if (!code) {
    message.textContent = ui[currentLang].couponReq;
    message.className = 'text-xs mt-2 text-red-500';
    message.classList.remove('hidden');
    return;
  }
  
  const coupon = couponCodes.find(c => c.code === code);
  
  if (coupon) {
    appliedCoupon = coupon;
    message.textContent = `${ui[currentLang].couponApp} ${coupon.discount * 100}% discount`;
    message.className = 'text-xs mt-2 text-green-600 font-bold';
    message.classList.remove('hidden');
    input.value = '';
    updateCartUI();
  } else {
    message.textContent = ui[currentLang].couponInv;
    message.className = 'text-xs mt-2 text-red-500';
    message.classList.remove('hidden');
  }
}

async function submitOrder() {
  const form = document.getElementById('order-form');
  const btn = document.getElementById('btn-submit');
  
  updateCartUI(); 

  if(!form.checkValidity()) {
    form.reportValidity();
    return;
  }

  const originalText = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${ui[currentLang].processing}`;

  try {
    const formData = new FormData(form);
    const response = await fetch('https://formspree.io/f/xwvwobwp', {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
      const modal = document.createElement('div');
      modal.className = `fixed inset-0 flex items-center justify-center bg-black/50 z-[200] ${currentLang === 'he' ? 'rtl' : ''}`;
      modal.innerHTML = `
        <div class="bg-white p-8 rounded-[2.5rem] text-center max-w-sm shadow-2xl mx-4">
          <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-check text-3xl"></i>
          </div>
          <h3 class="text-2xl font-black mb-2">${ui[currentLang].orderConfirmed}</h3>
          <p class="text-slate-400 text-sm mb-4">${ui[currentLang].refNum}</p>
          <div class="bg-slate-50 py-3 rounded-2xl mb-6 border border-slate-100">
            <span class="text-2xl font-black text-slate-900 tracking-tight">#${currentOrderNumber}</span>
          </div>
          <p class="text-slate-500 text-sm mb-8 leading-relaxed">${ui[currentLang].contactShortly}</p>
          <button onclick="location.reload()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">
            ${ui[currentLang].returnStore}
          </button>
        </div>
      `;
      document.body.appendChild(modal);
      cart = [];
    } else {
      throw new Error('Submission failed');
    }
  } catch (error) {
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
}

  if (p) {
    showProduct(p.id, false);
  }
}

initApp();
</script>
